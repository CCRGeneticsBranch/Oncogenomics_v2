<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Chatbot to MCP Workflow by Layer</title>
  <desc id="desc">Grouped flow diagram with swimlanes for MCP Client, MCP Server, MCP Tools, and fallback path.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .lane-client { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; }
      .lane-server { fill: #ecfeff; stroke: #0e7490; stroke-width: 2; }
      .lane-tools { fill: #f0fdf4; stroke: #166534; stroke-width: 2; }
      .lane-fallback { fill: #fef2f2; stroke: #991b1b; stroke-width: 2; }
      .lane-title { font: 700 24px Segoe UI, Arial, sans-serif; fill: #111827; }
      .main-title { font: 700 38px Segoe UI, Arial, sans-serif; fill: #1f2937; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 10; }
      .label { font: 18px Segoe UI, Arial, sans-serif; fill: #111827; }
      .small { font: 15px Segoe UI, Arial, sans-serif; fill: #374151; }
      .flow { stroke: #1f2937; stroke-width: 2.4; fill: none; }
      .alt { stroke: #6d28d9; stroke-width: 2.2; fill: none; }
      .fail { stroke: #b91c1c; stroke-width: 2.2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#1f2937" />
    </marker>
    <marker id="arrow-alt" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#6d28d9" />
    </marker>
    <marker id="arrow-fail" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#b91c1c" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980" />
  <text class="main-title" x="36" y="50">Chatbot to MCP Workflow (Grouped by Layer)</text>

  <!-- Swimlanes -->
  <rect class="lane-client" x="24" y="84" width="520" height="860" rx="12" />
  <text class="lane-title" x="42" y="120">MCP Client Layer (ProjectController)</text>

  <rect class="lane-server" x="560" y="84" width="430" height="860" rx="12" />
  <text class="lane-title" x="578" y="120">MCP Server Layer (OncoServer)</text>

  <rect class="lane-tools" x="1008" y="84" width="300" height="860" rx="12" />
  <text class="lane-title" x="1026" y="120">MCP Tools Layer</text>

  <rect class="lane-fallback" x="1326" y="84" width="250" height="860" rx="12" />
  <text class="lane-title" x="1344" y="120">Fallback Layer</text>

  <!-- Client boxes -->
  <rect class="box" x="58" y="160" width="450" height="54" />
  <text class="label" x="82" y="194">1. User submits chatbot query</text>

  <rect class="box" x="58" y="242" width="450" height="54" />
  <text class="label" x="82" y="276">2. runProjectChatbot validates input</text>

  <rect class="box" x="58" y="324" width="450" height="54" />
  <text class="label" x="82" y="358">3. interpretChatbotQuery extracts intent</text>

  <rect class="box" x="58" y="406" width="450" height="70" />
  <text class="label" x="82" y="438">4. resolveGeneSymbol and mutation type</text>
  <text class="small" x="82" y="461">Optional LLM parse when rule-based parsing is uncertain</text>

  <rect class="box" x="58" y="504" width="450" height="54" />
  <text class="label" x="82" y="538">5. Build MCP args and call initialize</text>

  <rect class="box" x="58" y="586" width="450" height="54" />
  <text class="label" x="82" y="620">6. Send tools call with action and args</text>

  <rect class="box" x="58" y="738" width="450" height="70" />
  <text class="label" x="82" y="770">7. Parse structured response redirect_url</text>
  <text class="small" x="82" y="793">Redirect user to target page when valid</text>

  <!-- Server boxes -->
  <rect class="box" x="596" y="520" width="356" height="54" />
  <text class="label" x="620" y="554">A. Receive initialize request</text>

  <rect class="box" x="596" y="602" width="356" height="54" />
  <text class="label" x="620" y="636">B. Receive tools call request</text>

  <rect class="box" x="596" y="684" width="356" height="54" />
  <text class="label" x="620" y="718">C. Match tool by action name</text>

  <!-- Tools box at y=200 -->
  <rect class="box" x="1038" y="200" width="240" height="208" />
  <text class="label" x="1060" y="230">Tool handlers</text>
  <text class="small" x="1060" y="258">ExpressionByGeneTool</text>
  <text class="small" x="1060" y="282">MutationByGeneTool</text>
  <text class="small" x="1060" y="306">FusionByGeneTool</text>
  <text class="small" x="1060" y="330">CnvByGeneTool</text>
  <text class="small" x="1060" y="354">BaseGeneRedirectTool.handle</text>

  <!-- Fallback box -->
  <rect class="box" x="1352" y="510" width="198" height="244" />
  <text class="label" x="1370" y="542">Fallback routes</text>
  <text class="small" x="1370" y="574">expression by gene</text>
  <text class="small" x="1370" y="602">mutation by gene</text>
  <text class="small" x="1370" y="630">fusion by gene</text>
  <text class="small" x="1370" y="658">cnv by gene</text>
  <text class="small" x="1370" y="700">Used if initialize fails,</text>
  <text class="small" x="1370" y="724">tools call fails, or</text>
  <text class="small" x="1370" y="748">redirect_url is missing</text>

  <!-- In-client vertical flow -->
  <path class="flow" marker-end="url(#arrow)" d="M283 214 L283 242" />
  <path class="flow" marker-end="url(#arrow)" d="M283 296 L283 324" />
  <path class="flow" marker-end="url(#arrow)" d="M283 378 L283 406" />
  <path class="flow" marker-end="url(#arrow)" d="M283 476 L283 504" />
  <path class="flow" marker-end="url(#arrow)" d="M283 558 L283 586" />

  <!-- Cross-lane main flow -->
  <path class="flow" marker-end="url(#arrow)" d="M508 531 L596 547" />
  <path class="flow" marker-end="url(#arrow)" d="M508 613 L596 629" />
  <path class="flow" marker-end="url(#arrow)" d="M952 711 L1158 711 L1158 408" />
  <path class="flow" marker-end="url(#arrow)" d="M1038 304 L952 304 L952 773 L508 773" />

  <!-- Server internal flow -->
  <path class="flow" marker-end="url(#arrow)" d="M774 574 L774 602" />
  <path class="flow" marker-end="url(#arrow)" d="M774 656 L774 684" />

  <!-- LLM alternate path -->
  <path class="alt" marker-end="url(#arrow-alt)" d="M508 356 C555 356, 555 438, 508 438" />
  <text class="small" x="522" y="398" fill="#6d28d9">LLM fallback</text>

  <!-- Fallback links -->
  <path class="fail" marker-end="url(#arrow-fail)" d="M952 547 C1160 547, 1240 547, 1352 547" />
  <path class="fail" marker-end="url(#arrow-fail)" d="M952 629 C1160 629, 1240 600, 1352 600" />
  <path class="fail" marker-end="url(#arrow-fail)" d="M508 773 C980 773, 1180 690, 1352 690" />

  <text class="small" x="980" y="533" fill="#b91c1c">initialize failure</text>
  <text class="small" x="980" y="615" fill="#b91c1c">tools call failure</text>
  <text class="small" x="982" y="758" fill="#b91c1c">invalid redirect payload</text>
</svg>
